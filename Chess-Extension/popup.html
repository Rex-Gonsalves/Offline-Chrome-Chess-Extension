<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline Pixel Chess</title>
  <style>
    body { width: 270px; margin: 0; padding: 18px; color: #171717; background: #f4f4f0;
      font: 14px/1.45 Arial, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0 0 15px; color: #555; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px; border:1px solid #aaa; background:#fff; }
    .label { font-weight:700; }
    .switch { position:relative; width:46px; height:26px; flex:none; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; cursor:pointer; background:#999; border-radius:20px; transition:.2s; }
    .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px;
      background:white; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:#171717; }
    input:checked + .slider:before { transform:translateX(20px); }
    #status { margin-top:12px; font-size:12px; color:#444; }
    button { width:100%; margin-top:12px; padding:9px; background:#171717; color:#fff;
      border:0; cursor:pointer; font-weight:700; }
  </style>
</head>
<body>
  <h1>OFFLINE PIXEL CHESS</h1>
  <p>Choose what happens when a website cannot load because of a network error.</p>
  <div class="row">
    <span class="label">Enable offline chess</span>
    <label class="switch" aria-label="Enable offline chess">
      <input id="enabled" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
  <div id="status" role="status">Loading setting…</div>
  <button id="play">Play chess now</button>
  <script src="popup.js"></script>
</body>
</html>
